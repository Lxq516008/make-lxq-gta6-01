<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 12, 18, 0.72); z-index: 10; }
  .panel { width: min(620px, 92vw); max-height: 88vh; overflow-y: auto; background: #141a22; color: #f5f1e6; border: 2px solid #ffcf3f; border-radius: 12px; padding: 28px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .panel h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 2px; color: #ffcf3f; text-align: center; }
  .panel .sub { color: #cfc8b8; text-align: center; line-height: 1.6; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .btns button { padding: 12px; font-size: 17px; font-weight: 700; color: #141a22; background: #ffcf3f; border: none; border-radius: 8px; cursor: pointer; }
  .btns button:hover { background: #ffe08a; }
  .mission { background: #1d2632; border-radius: 8px; padding: 10px 12px; margin: 8px 0; line-height: 1.5; }
  .mission.done { border-left: 4px solid #4caf6d; }
  .mission span { color: #cfc8b8; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Steal cars, outrun the police, and complete missions."></canvas>
<div id="menu"><div class="panel"><h1 id="menu-title">SOLMAR BAY</h1><div id="menu-body"></div></div></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
